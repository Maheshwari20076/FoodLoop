{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="fl-form-card" style="max-width: 560px; width:100%;">
    <div class="text-center mb-4">
      <span class="brand-mark d-inline-flex mb-2" style="width:46px;height:46px;font-size:1.3rem;"><i class="bi bi-recycle"></i></span>
      <h3 class="mb-1">Create your account</h3>
      <p class="text-muted-fl mb-0">Join FoodLoop and help rescue surplus food</p>
    </div>

    <form method="POST" id="registerForm">
      <div class="role-toggle">
        <input type="radio" name="role" id="role_donor" value="donor" {{ 'checked' if form.get('role','donor') == 'donor' }}>
        <label for="role_donor"><i class="bi bi-shop d-block mb-1 fs-5"></i>I'm a Donor</label>

        <input type="radio" name="role" id="role_recipient" value="recipient" {{ 'checked' if form.get('role') == 'recipient' }}>
        <label for="role_recipient"><i class="bi bi-house-heart d-block mb-1 fs-5"></i>I'm a Recipient</label>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Your Full Name *</label>
          <input type="text" name="name" class="form-control" value="{{ form.get('name','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" id="orgLabel">Organization / Establishment Name *</label>
          <input type="text" name="organization_name" class="form-control" value="{{ form.get('organization_name','') }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" value="{{ form.get('phone','') }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>

        <div class="col-md-8">
          <label class="form-label">Address</label>
          <input type="text" name="address" class="form-control" value="{{ form.get('address','') }}" placeholder="Street, landmark">
        </div>
        <div class="col-md-4">
          <label class="form-label">Area *</label>
          <select name="area" class="form-select" required>
            {% for a in areas %}
              <option value="{{ a }}" {{ 'selected' if form.get('area') == a }}>{{ a }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6 recipient-only" style="display:none;">
          <label class="form-label">Recipient Type *</label>
          <select name="recipient_type" class="form-select">
            <option value="" disabled selected>Choose...</option>
            <option value="NGO" {{ 'selected' if form.get('recipient_type')=='NGO' }}>NGO</option>
            <option value="Shelter" {{ 'selected' if form.get('recipient_type')=='Shelter' }}>Shelter</option>
            <option value="Community Kitchen" {{ 'selected' if form.get('recipient_type')=='Community Kitchen' }}>Community Kitchen</option>
            <option value="Orphanage" {{ 'selected' if form.get('recipient_type')=='Orphanage' }}>Orphanage</option>
            <option value="Old Age Home" {{ 'selected' if form.get('recipient_type')=='Old Age Home' }}>Old Age Home</option>
          </select>
        </div>
        <div class="col-md-6 recipient-only" style="display:none;">
          <label class="form-label">Daily Meal Capacity</label>
          <input type="number" min="1" name="daily_meal_capacity" class="form-control" value="{{ form.get('daily_meal_capacity','50') }}">
        </div>
      </div>

      <button type="submit" class="btn btn-fl-primary w-100 py-2 mt-4">Create Account</button>
    </form>

    <p class="text-center small text-muted-fl mt-4 mb-0">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>

<script>
  function toggleRoleFields() {
    const isRecipient = document.getElementById('role_recipient').checked;
    document.querySelectorAll('.recipient-only').forEach(el => {
      el.style.display = isRecipient ? '' : 'none';
      el.querySelectorAll('select').forEach(s => s.required = isRecipient);
    });
    document.getElementById('orgLabel').textContent = isRecipient
      ? 'Organization Name *'
      : 'Business / Establishment Name *';
  }
  document.getElementById('role_donor').addEventListener('change', toggleRoleFields);
  document.getElementById('role_recipient').addEventListener('change', toggleRoleFields);
  toggleRoleFields();
</script>
{% endblock %}
