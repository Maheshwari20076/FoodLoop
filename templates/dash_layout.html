{% extends "base.html" %}
{% block content %}
<div class="dash-shell">
  <aside class="dash-sidebar">
    <nav class="nav flex-column">
      {% block sidebar_links %}{% endblock %}
    </nav>
  </aside>
  <main class="dash-main">
    <div class="dash-header d-flex flex-wrap justify-content-between align-items-start gap-3">
      <div>
        <h2 class="mb-1">{% block page_title %}{% endblock %}</h2>
        <p class="text-muted-fl mb-0">{% block page_subtitle %}{% endblock %}</p>
      </div>
      <div>{% block page_actions %}{% endblock %}</div>
    </div>
    {% block dash_content %}{% endblock %}
  </main>
</div>
{% endblock %}
